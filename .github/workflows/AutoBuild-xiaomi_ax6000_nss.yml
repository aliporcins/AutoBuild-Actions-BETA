name: xiaomi_ax6000_nss

permissions:
  contents: write

on:
  repository_dispatch:
  ## Git Push 时触发编译(不要删除此行注释)
  #push:
  #  branches: 
  #    - master
  
  ## 定时触发编译(不要删除此行注释)
  #schedule:
  #  - cron: 0 8 * * 5
  
  ## 重新点亮 Star 时触发编译(不要删除此行注释)
  #watch:
  #  types: [started]
  
  ### 界面控制部分 ( 以下内容请保持不变, 如有需要仅修改 options 选项 )
  workflow_dispatch:
    inputs:
      Tempoary_CONFIG:
        description: '配置文件'
        default: 'xiaomi_ax6000_nss'
        type: choice
        options:
          - 'xiaomi_ax6000_nss'
      Tempoary_FLAG:
        description: '固件标签'
        default: 'AUTO'
        type: choice
        options:
          - 'AUTO'
          - 'Full'
          - 'AP'
          - 'Test'
      Tempoary_IP:
        description: '固件 IP 地址 [可选]'
        default: ''
      Tempoary_HOSTNAME:
        description: '固件主机名 [可选]'
        default: ''
      UPLOAD_RELEASES:
        description: '上传固件到 Releases'
        default: 'true'
        type: boolean
      UPLOAD_ARTIFACTS:
        description: '上传固件到 Artifacts'
        default: 'false'
        type: boolean
      UPLOAD_BIN_ARTIFACTS:
        description: '上传 bin 文件夹到 Artifacts'
        default: 'false'
        type: boolean
      ### 界面控制部分结束 ( 以上内容请保持不变 )

### 请按需求修改以下内容
### 环境变量设置
env:
# 编译时调用的 [.config] 文件名称
  CONFIG_FILE: xiaomi_ax6000_nss
# 源码仓库:分支 (kuncy7 NSS 树: OpenWrt 主线 2026-10-09 + 内核 6.18 + NSS, 分支 c3po-tag-8021q)
  DEFAULT_SOURCE: kuncy7/openwrt-nss-edma:c3po-tag-8021q
# 开启 ccache (Diy 步骤据此向 .config 追加 CONFIG_CCACHE=y)
  CACHE_ACCELERATE: 'true'
# 删除无用文件以增加编译空间
  DELETE_USELESS_FILES: true
# 删除早期的 workflow 任务
  DELETE_OLD_WORKFLOW: false
### 结束
### 请按需求修改以上内容

jobs:
  Compile:
    runs-on: ubuntu-22.04

    steps:
    
    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space (Ubuntu)
      if: env.DELETE_USELESS_FILES == 'true' && !cancelled()
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -o pipefail
        sudo -E docker image prune -af
        sudo -E rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc
        sudo -E apt-mark hold grub-efi-amd64-signed
        sudo -E apt update
        sudo -E apt -y purge \
          azure-cli* \
          ghc* \
          zulu* \
          firefox \
          google* \
          powershell* \
          mongodb* \
          mysql* \
          php* \
          dotnet* \
          snap*
        sudo -E apt -y autoremove --purge
        sudo -E apt install -y \
          ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache \
          cmake cpio curl device-tree-compiler flex gawk \
          gcc-multilib g++-multilib gettext genisoimage git \
          gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz msmtp ninja-build p7zip \
          p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip vim wget xmlto xxd zlib1g-dev \
          python-is-python3 flex
        sudo -E apt-get install -y npm
        # dwarves provides pahole, required to generate kernel BTF
        # (CONFIG_KERNEL_DEBUG_INFO_BTF) and by the vmlinux-btf fallback
        # package; run 9's runner had no pahole (only a commented-out
        # clang-18 line mentioned it), so neither BTF path could build.
        sudo -E apt-get install -y dwarves
        sudo -E npm install -g pnpm
        curl -fsSL https://apt.llvm.org/llvm.sh | sudo -E bash -s -- 18
        sudo -E apt install -y clang-18 llvm-18 lld-18 pahole
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
        sudo update-alternatives --set clang /usr/bin/clang-18
        sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100
        # curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        # sudo -E apt install -y nodejs
        # sudo -E npm install -g pnpm@10
          # sudo -E systemctl daemon-reload
        sudo -E apt clean
        node -v
        # fail-fast: Node 主版本必须 ≥20（pnpm 12 / vite 8 要求 node 20+；apt 自带的 node 12 会导致数小时后 daed web 构建失败且 web/ 为空）
        NODE_MAJOR=$(node -v 2>/dev/null | sed 's/^v//; s/\..*//')
        if ! [ "$NODE_MAJOR" -ge 20 ] 2>/dev/null; then echo "ERROR: node major version must be >= 20, got: $(node -v 2>/dev/null || echo missing)"; exit 1; fi
        command -v pnpm >/dev/null 2>&1 || { echo "ERROR: pnpm not found"; exit 1; }
        pnpm --version || { echo "ERROR: pnpm --version failed"; exit 1; }
        pnpm -v
        df -h
        free -m
        echo "CPU Cores: $(nproc)"
        echo "Clang version:"
        clang --version

    - name: Cache ccache (best-effort; first build is cold regardless)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-nss-6.18-xiaomi_ax6000_nss
        save-always: true

    - name: Load Custom Variables
      run: |
        if [ -n "${{ github.event.inputs.Tempoary_CONFIG }}" ]
        then
            if [ -f "$GITHUB_WORKSPACE/Configs/${{ github.event.inputs.Tempoary_CONFIG }}" ]
            then
                CONFIG_FILE=${{ github.event.inputs.Tempoary_CONFIG }}
            else
                CONFIG_FILE=${{ env.CONFIG_FILE }}
            fi
        else
            CONFIG_FILE=${{ env.CONFIG_FILE }}
        fi
        if [ ! -f "$GITHUB_WORKSPACE/Configs/$CONFIG_FILE" ]
        then
            echo "CONFIG_FILE: [/Config/$CONFIG_FILE] is not detected ..."
            exit 1
        else
            echo "CONFIG_FILE: [/Config/$CONFIG_FILE]"
            echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
        fi
        if [ -n "${{ github.event.inputs.Tempoary_IP }}" ]
        then
            echo "IP: [${{ github.event.inputs.Tempoary_IP }}]"
            echo "Tempoary_IP=${{ github.event.inputs.Tempoary_IP }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ github.event.inputs.Tempoary_HOSTNAME }}" ]
        then
            echo "HOSTNAME: [${{ github.event.inputs.Tempoary_HOSTNAME }}]"
            echo "Tempoary_HOSTNAME=${{ github.event.inputs.Tempoary_HOSTNAME }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ github.event.inputs.Tempoary_FLAG }}" ]
        then
            echo "FLAG: [${{ github.event.inputs.Tempoary_FLAG }}]"
            echo "Tempoary_FLAG=${{ github.event.inputs.Tempoary_FLAG }}" >> $GITHUB_ENV
        fi
        REPO_URL="https://github.com/$(cut -d \: -f 1 <<< ${{ env.DEFAULT_SOURCE }})"
        REPO_BRANCH=$(cut -d \: -f 2 <<< ${{ env.DEFAULT_SOURCE }})
        echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
        echo "Compile_Date=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        echo "Display_Date=$(date +%Y/%m/%d)" >> $GITHUB_ENV
        if [[ -z "${{ github.event.inputs.Tempoary_CONFIG }}" ]]; then
            echo "TIMED_TRIGGER=true" >> $GITHUB_ENV
        else
            echo "UPLOAD_RELEASES=${{ github.event.inputs.UPLOAD_RELEASES }}" >> $GITHUB_ENV
            echo "UPLOAD_ARTIFACTS=${{ github.event.inputs.UPLOAD_ARTIFACTS }}" >> $GITHUB_ENV
            echo "UPLOAD_BIN_ARTIFACTS=${{ github.event.inputs.UPLOAD_BIN_ARTIFACTS }}" >> $GITHUB_ENV
        fi

    - name: TIMED_TRIGGER
      if: env.TIMED_TRIGGER == 'true'
      env:
        UPLOAD_RELEASES: true
        UPLOAD_ARTIFACTS: false
        UPLOAD_BIN_ARTIFACTS: false
      run: |
        echo "UPLOAD_RELEASES=${UPLOAD_RELEASES}" >> $GITHUB_ENV
        echo "UPLOAD_ARTIFACTS=${UPLOAD_ARTIFACTS}" >> $GITHUB_ENV
        echo "UPLOAD_BIN_ARTIFACTS=${UPLOAD_BIN_ARTIFACTS}" >> $GITHUB_ENV

    - name: Clone Openwrt Source Code
      run: |
        git clone -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Revert NSS debug commit (MAGIC_SYSRQ_SERIAL / DEVMEM)
      run: |
        # kuncy7 tree commit b97854b2 ("qualcommax: ipq50xx: debug aids for NSS
        # bring-up work", 2026-08-25) enables MAGIC_SYSRQ_SERIAL + DEVMEM with
        # STRICT_DEVMEM off in target/linux/qualcommax/ipq50xx/config-default.
        # The tree's README says to revert it for any build meant to be
        # deployed; it is one commit touching one file, so the revert is clean.
        # Idempotent: if the lines are already gone (upstream reverted it),
        # skip the revert and just verify.
        cd openwrt
        if grep -q "CONFIG_MAGIC_SYSRQ_SERIAL=y" target/linux/qualcommax/ipq50xx/config-default; then
          echo "Debug commit present, reverting b97854b2 ..."
          git revert --no-commit b97854b2400db7b4a9ce2b5c1e9311a00b167037
          git status --short target/linux/qualcommax/ipq50xx/config-default
        else
          echo "Debug lines already absent, nothing to revert"
        fi
        if grep -q "CONFIG_MAGIC_SYSRQ_SERIAL=y" target/linux/qualcommax/ipq50xx/config-default || grep -q "^CONFIG_DEVMEM=y" target/linux/qualcommax/ipq50xx/config-default; then
          echo "ERROR: debug kernel options still present after revert"
          exit 1
        fi
        echo "Verified: MAGIC_SYSRQ_SERIAL and DEVMEM are off in the NSS tree"

    - name: Run Diy Scripts
      env:
        # v5 (2026-11-25): the AX6000's own WARP account (ECDSA, MASQUE).
        # Injected by AutoBuild_DiyScript.sh into the sing-box starter
        # AFTER the keyless repo checks. Never committed to git.
        AX6000_WARP_PRIVATE_KEY: ${{ secrets.AX6000_WARP_PRIVATE_KEY }}
        AX6000_WARP_IPV4: ${{ secrets.AX6000_WARP_IPV4 }}
        AX6000_WARP_IPV6: ${{ secrets.AX6000_WARP_IPV6 }}
      run: |
        chmod +x Scripts/AutoBuild_*.sh
        cd openwrt
        if [ "${{ env.CACHE_ACCELERATE }}" == true ]
        then
            echo -e "\nCONFIG_DEVEL=y\nCONFIG_CCACHE=y\n" >> $GITHUB_WORKSPACE/Configs/$CONFIG_FILE
        fi
        cp $GITHUB_WORKSPACE/Configs/$CONFIG_FILE .config
        source $GITHUB_WORKSPACE/Scripts/AutoBuild_DiyScript.sh
        source $GITHUB_WORKSPACE/Scripts/AutoBuild_Function.sh
        make defconfig
        Firmware_Diy_Start
        rm -f .config && cp $GITHUB_WORKSPACE/Configs/$CONFIG_FILE .config
        Firmware_Diy_Main
        Firmware_Diy
        Firmware_Diy_Other

    - name: Pre-download Libraries
      run: |
        cd openwrt
        # DIAG (2026-11-18, run 44255529707): the fail-fast below aborted on
        # CONFIG_PACKAGE_luci-app-autoreboot even though the Config requests
        # it, the package was copied into package/ by Firmware_Diy, and its
        # Makefile was fixed (+cron dropped). Print the ground truth at each
        # stage so the next failure names the culprit instead of guessing.
        # RESTORED 2026-11-22 (user correction: autoreboot is wanted).
        echo "=== DIAG: autoreboot before feeds install ==="
        ls -ld package/luci-app-autoreboot && grep -E "PKG_NAME|LUCI_DEPENDS" package/luci-app-autoreboot/Makefile || echo "DIAG: autoreboot dir/Makefile MISSING before feeds install"
        ./scripts/feeds install -a
        echo "=== DIAG: autoreboot after feeds install ==="
        ls -ld package/luci-app-autoreboot && grep -E "PKG_NAME|LUCI_DEPENDS" package/luci-app-autoreboot/Makefile || echo "DIAG: autoreboot dir/Makefile MISSING after feeds install"
        find package/luci-app-autoreboot/luasrc package/luci-app-autoreboot/root -type f 2>/dev/null || echo "DIAG: autoreboot luasrc/root layout MISSING (empty package risk)"
        make defconfig
        echo "=== DIAG: defconfig outcome ==="
        grep -A4 'config PACKAGE_luci-app-autoreboot' tmp/.config-package.in || echo "DIAG: autoreboot symbol NOT in tmp/.config-package.in"
        grep "^CONFIG_PACKAGE_luci-app-autoreboot" .config || echo "DIAG: autoreboot NOT in .config after defconfig"
        grep "^CONFIG_PACKAGE_luci-app-ramfree" .config || echo "DIAG: ramfree NOT in .config (control)"
        grep "^CONFIG_PACKAGE_luci-compat" .config || echo "DIAG: luci-compat NOT selected"
        grep "^CONFIG_PACKAGE_kmod-usb-storage" .config && echo "DIAG: usb-storage still selected (unexpected, AX6000 has no USB port)" || echo "DIAG: usb-storage absent as expected"
        grep "^CONFIG_PACKAGE_block-mount" .config && echo "DIAG: block-mount still selected (unexpected, AX6000 has no USB port)" || echo "DIAG: block-mount absent as expected"
        # Fail fast on silent defconfig drops: these symbols were lost
        # without a word in earlier runs (autoreboot: +cron dep;
        # totp: not copied into the tree; i18n: language not enabled).
        # A missing symbol must abort the build, not ship an image
        # missing a promised feature.
        # NOTE: kmod-usb-storage/block-mount were in this list in 2b78e75
        # but were removed 2026-11-18 -- AX6000 hardware has no USB port.
        # NOTE: cloudflared was in this list in 2b78e75 but was removed
        # 2026-11-19 -- user removed cloudflared from the build (room
        # for the OpenClash Meta core), so it must not be required here.
        # NOTE: luci-app-totp was in this list but was removed
        # 2026-11-19 -- user removed TOTP from the build, so it
        # must not be required here.
        # NOTE: luci-app-autoreboot RESTORED 2026-11-22 (user correction:
        # wanted). It is back in the fail-fast list.
        for pkg in luci-app-autoreboot luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn; do
          grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || { echo "ERROR: CONFIG_PACKAGE_${pkg} dropped by defconfig"; exit 1; }
        done
        grep -q "^CONFIG_LUCI_LANG_zh_Hans=y" .config || { echo "ERROR: CONFIG_LUCI_LANG_zh_Hans dropped by defconfig"; exit 1; }
        # LITE firmware (2026-11-24): zram must survive defconfig (AX6000
        # has 422MB RAM; a running proxy leaves 23-50MB). If the feed
        # lacks zram-swap/kmod-zram, defconfig silently drops them and
        # the image would ship without the memory relief.
        for pkg in kmod-zram zram-swap kmod-lib-lz4 kmod-lib-lzo; do
          grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || { echo "ERROR: CONFIG_PACKAGE_${pkg} dropped by defconfig (lite firmware needs zram)"; exit 1; }
        done
        # (2026-11-25 v2): sched + ppp userspace must stay ON after
        # defconfig -- the AX6000 also serves as a main router (user
        # confirmed 2026-11-25), so PPPoE dial-up and traffic control
        # must survive. (Removed 2026-11-24 as "AP-only", reverted.)
        # A silent drop by defconfig would ship a main router without
        # dial-up -- fail loudly.
        for pkg in kmod-sched-core kmod-sched-bpf ppp ppp-mod-pppoe; do
          grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || { echo "ERROR: CONFIG_PACKAGE_${pkg} dropped by defconfig (main-router firmware needs sched/ppp)"; exit 1; }
        done
        make download -j$(nproc)

    - name: Build OpenWrt
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        [ "$?" == 0 ] && echo "Compile_Result=true" >> $GITHUB_ENV || echo "Compile_Result=false" >> $GITHUB_ENV
        # POST-BUILD GATE (2026-11-18, run 44265325657): autoreboot built
        # EMPTY (apk db I:1, zero files) while every config check passed --
        # upstream's files/ layout is ignored by luci.mk. Verify the built
        # .apk actually contains the 4 files; fail the build otherwise so
        # an empty package can never reach the Release again. This only
        # runs when make succeeded (the line above exits the step on
        # build failure under bash -e).
        # RESTORED 2026-11-22 (user correction: autoreboot is wanted).
        # GATE RULES (2026-11-18; runs 44281351061 + 44302462584 +
        # 44331411291 all failed a GOOD build on gate bugs, never on
        # the firmware):
        # - Locate the .apk with `find` under bin/ -- NEVER hard-code a
        #   path. bin/packages was wrong (44281351061); bin/targets +
        #   staging_dir/packages was right but the glob was wrong
        #   (44302462584): apk v3 filenames use a HYPHEN after the
        #   name, e.g. luci-app-autoreboot-1.0-r1.apk (real 25.12.0
        #   sample: luci-app-commands-26.320.60423~5331286.apk), NOT
        #   the old .ipk-style underscore. The glob below matches
        #   both separators so a naming change cannot fail the gate.
        # - .apk is ADB format (magic ADBd, DEFLATE), NOT a gzip tar,
        #   so `tar tzf` can NEVER list it. Use the host apk tool
        #   (staging_dir/host/bin/apk -- the tree builds it and uses
        #   it to install the rootfs, include/rootfs.mk:48) to
        #   extract and check the files on disk.
        # - ABSOLUTIZE every path before any cd: the extract subshell
        #   does `cd /tmp/autoreboot-apk-x` first, so a relative
        #   $APK_BIN dies with "No such file or directory" even though
        #   find just returned it (44331411291). $APK was already
        #   absolutized ($APK_ABS); $APK_BIN was not. Local validation
        #   must reproduce the exact subshell (cd + relative path) --
        #   the earlier 8/8 validation ran extract without the cd and
        #   missed this.
        # - A NEW gate goes live WARN-ONLY first and becomes blocking
        #   only after one run on real build artifacts proves it
        #   passes on a good build. This gate stays blocking because
        #   it is a bug fix to an existing gate (not a new gate) and
        #   the fixed logic was validated locally against the exact
        #   failure mode (old logic reproduces the CI error byte for
        #   byte; new logic passes; empty-extract control still fails
        #   the content check) before landing.
        echo "=== POST-BUILD GATE: autoreboot apk content ==="
        APK=$(find bin -name 'luci-app-autoreboot*.apk' 2>/dev/null | head -n1)
        [ -n "$APK" ] || { echo "ERROR: luci-app-autoreboot apk not found under bin"; exit 1; }
        echo "Found apk: $APK"
        APK_BIN=$(find staging_dir/host/bin -maxdepth 1 -name apk -type f 2>/dev/null | head -n1)
        [ -n "$APK_BIN" ] || { echo "ERROR: host apk tool not found under staging_dir/host/bin"; exit 1; }
        APK_BIN="$(pwd)/$APK_BIN"  # extract subshell cds to /tmp; relative path would die there
        echo "Host apk tool: $APK_BIN"
        APK_ABS="$(pwd)/$APK"
        rm -rf /tmp/autoreboot-apk-x && mkdir -p /tmp/autoreboot-apk-x
        (cd /tmp/autoreboot-apk-x && "$APK_BIN" extract --allow-untrusted "$APK_ABS") || { echo "ERROR: cannot extract $APK"; exit 1; }
        for f in etc/init.d/autoreboot etc/config/autoreboot usr/lib/lua/luci/controller/autoreboot.lua usr/lib/lua/luci/model/cbi/autoreboot.lua; do
          [ -f "/tmp/autoreboot-apk-x/$f" ] || { echo "ERROR: autoreboot apk is missing $f (empty package)"; exit 1; }
        done
        echo "POST-BUILD GATE OK: autoreboot apk contains all 4 files"

        # WARN-ONLY (2026-11-19, mounts-fix + plugins-hide): the files/ overlay must
        # have reached the assembled rootfs. Check the TARGET_DIR copy
        # (build_dir/target-*/root-*/...), NOT a package .pkgdir copy
        # (which never sees the overlay). Warn only -- this check has
        # never run on real artifacts; it becomes blocking only after
        # one run proves it passes on a good build. The post-build
        # deep-verify report is the real proof either way.
        echo "=== WARN-ONLY: mounts+plugins menu overlay in rootfs ==="
        ROOT_MENU=$(find build_dir -path '*/root-*/usr/share/luci/menu.d/luci-mod-system.json' -type f 2>/dev/null | head -n1)
        if [ -z "$ROOT_MENU" ]; then
          echo "WARN: no rootfs menu JSON found under build_dir (overlay reach unverified -- see deep-verify report)"
        elif grep -q "mounts\|/sbin/block\|plugins" "$ROOT_MENU"; then
          echo "WARN: rootfs menu JSON still contains mounts, plugins or /sbin/block ($ROOT_MENU) -- overlay did not apply"
        else
          echo "WARN-ONLY OK: rootfs menu JSON has no mounts/plugins entry ($ROOT_MENU)"
        fi

    - name: Checkout Firmware
      if: steps.compile.outcome == 'success' && !cancelled()
      run: |
        cd openwrt
        source $GITHUB_WORKSPACE/Scripts/AutoBuild_Function.sh
        Firmware_Diy_End

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@main
      if: env.UPLOAD_ARTIFACTS == 'true' && steps.compile.outcome == 'success' && !cancelled()
      with:
        name: ${{ env.CONFIG_FILE }}_firmware_${{ env.Compile_Date }}
        path: openwrt/bin/Firmware

    - name: Upload bin to Artifacts
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: env.UPLOAD_BIN_ARTIFACTS == 'true' && steps.compile.outcome == 'success' && !cancelled()
      with:
        name: ${{ env.CONFIG_FILE }}_bin_${{ env.Compile_Date }}
        path: openwrt/bin

    - name: Upload Firmware to Release
      uses: svenstaro/upload-release-action@v2
      if: env.UPLOAD_RELEASES == 'true' && steps.compile.outcome == 'success' && !cancelled()
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: openwrt/bin/Firmware/*
        file_glob: true
        tag: AutoUpdate-NSS
        overwrite: true
        
    - name: Refresh API (1/2)
      if: env.UPLOAD_RELEASES == 'true' && steps.compile.outcome == 'success' && !cancelled()
      run: |
        # v3 fix 2026-11-25: unauthenticated api.github.com calls are limited to 60/h per
        # runner IP; run 45519214973 failed here with "403 rate limit exceeded" after a
        # successful compile+upload. Authenticate with the built-in token (5000/h limit).
        # GitHub Actions masks secrets.GITHUB_TOKEN in logs automatically.
        wget --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{github.repository}}/releases/tags/AutoUpdate-NSS -O API
        
    - name: Refresh API (2/2)
      if: env.UPLOAD_RELEASES == 'true' && steps.compile.outcome == 'success' && !cancelled()
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./API
        file_glob: true
        tag: AutoUpdate-NSS
        overwrite: true

    - name: Delete old Workflow Runs
      continue-on-error: true
      if: env.DELETE_OLD_WORKFLOW == 'true' && !cancelled()
      uses: Mattraks/delete-workflow-runs@v2
      with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 0

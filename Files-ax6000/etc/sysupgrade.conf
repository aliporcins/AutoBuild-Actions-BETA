## Files and directories preserved across sysupgrade ("keep settings").
## OpenWrt already keeps /etc/config/, /etc/crontabs/, /etc/dropbear/,
## /etc/dnsmasq.d/ etc. via /lib/upgrade/keep.d/* -- this file adds the
## two user configs that are NOT covered by any keep.d entry or package
## conffile, so a sysupgrade with "keep settings" would otherwise LOSE
## them (2026-11-23 fixed firmware):
## - /etc/openclash/config/ : the user's Clash subscription files
##   (fy.yaml / lj.yaml) + the generated config.yaml. Only the config
##   dir -- NOT /etc/openclash/ itself, which holds the 57MB baked-in
##   clash_meta binary + 10MB GeoSite.dat (already in the new image;
##   backing them up is what made the old tarball huge).
## - /etc/sing-box/config.json : the user's sing-box runtime config
##   (MASQUE key + subscriptions). The .srs geo files are baked into
##   the image and are NOT backed up.
/etc/openclash/config/
/etc/sing-box/config.json

## Files and directories preserved across sysupgrade ("keep settings").
## OpenWrt already keeps /etc/config/, /etc/crontabs/, /etc/dropbear/,
## /etc/dnsmasq.d/ etc. via /lib/upgrade/keep.d/* -- this file adds the
## two user configs that are NOT covered by any keep.d entry or package
## conffile, so a sysupgrade with "keep settings" would otherwise LOSE
## them (2026-11-23 fixed firmware):
## - /etc/openclash/config/*.yaml : the user's Clash subscription files
##   (fy.yaml / lj.yaml) + the generated config.yaml. GLOB ONLY -- the
##   whole config/ dir is NOT listed, and /etc/openclash/ itself is
##   NOT listed either. The package keep.d entry for OpenClash is
##   narrowed the same way (Files-ax6000/lib/upgrade/keep.d/
##   luci-app-openclash): the 10MB GeoSite.dat + 57MB clash_meta
##   binary are NOT backed up -- GeoSite.dat is re-downloaded by
##   OpenClash, clash_meta is baked into the image (/rom) and restored
##   to /tmp on every boot by clash-kernel-restore.
##   (2026-11-25 v3: the old "/etc/openclash/config/" dir line plus
##   the package's "/etc/openclash/" keep.d entry together dragged
##   ~11.5MB into the backup tar; on 22MB free RAM the sysupgrade
##   save stage hung ~10 min and the v2 flash died before writing.)
## - /etc/sing-box/config.json : the user's sing-box runtime config
##   (MASQUE key + subscriptions). The .srs geo files are baked into
##   the image and are NOT backed up.
/etc/openclash/config/*.yaml
/etc/sing-box/config.json
